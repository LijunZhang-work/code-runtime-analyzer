name: 发布统一安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建后台、Web、MCP 和 VS Code 安装包
    runs-on: windows-latest

    steps:
      - name: 取出本次版本的源码
        uses: actions/checkout@v4

      - name: 准备 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            extension/package-lock.json
            web/package-lock.json

      - name: 安装构建依赖
        shell: pwsh
        run: npm run install:all

      - name: 准备固定且配套的 C++ 测试工具链
        shell: pwsh
        run: |
          $archive = Join-Path '${{ runner.temp }}' 'llvm-mingw-20260519-ucrt-x86_64.zip'
          $destination = Join-Path '${{ runner.temp }}' 'llvm-mingw-20260519'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260519/llvm-mingw-20260519-ucrt-x86_64.zip' -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expectedHash = '72dbd6e64614e3b3401998992d1bd9c8ace29e74611d71c80309ea71c3fb26f9'
          if ($actualHash -ne $expectedHash) { throw "LLVM-MinGW 下载文件校验失败：$actualHash" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $clangd = Get-ChildItem -LiteralPath $destination -Recurse -Filter 'clangd.exe' | Select-Object -First 1
          $clangxx = Get-ChildItem -LiteralPath $destination -Recurse -Filter 'clang++.exe' | Select-Object -First 1
          if (-not $clangd -or -not $clangxx) { throw 'LLVM-MinGW 压缩包缺少 clangd.exe 或 clang++.exe' }
          "CLANGD_TEST_PATH=$($clangd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLANGXX_PATH=$($clangxx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $clangd.FullName --version
          & $clangxx.FullName --version

      - name: 生成独立 Clang 测试夹具
        shell: pwsh
        run: npm run prepare:test-fixture

      - name: 执行后台测试
        shell: pwsh
        run: |
          npm --prefix backend test 2>&1 | Tee-Object -FilePath 'backend-test.log'
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            @(
              '### 后台测试失败详情',
              '',
              '```text'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content -LiteralPath 'backend-test.log' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $details = (Get-Content -LiteralPath 'backend-test.log' -Tail 160) -join "`n"
            $annotation = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=后台测试失败详情::$annotation"
            exit $testExitCode
          }

      - name: 编译 VS Code 扩展
        shell: pwsh
        run: npm --prefix extension run compile

      - name: 检查网页代码
        shell: pwsh
        run: npm --prefix web run lint

      - name: 构建网页生产版本
        shell: pwsh
        run: npm --prefix web run build

      - name: 准备扩展内置备用后台
        shell: pwsh
        run: npm run prepare:extension

      - name: 打包 VS Code 扩展
        working-directory: extension
        shell: pwsh
        run: npx --yes @vscode/vsce package --no-yarn --out "../Code-Runtime-Analyzer-${{ github.ref_name }}.vsix"

      - name: 准备独立后台发行目录
        shell: pwsh
        env:
          CRA_VSIX_PATH: ${{ github.workspace }}\Code-Runtime-Analyzer-${{ github.ref_name }}.vsix
        run: npm run prepare:windows-distribution

      - name: 安装成熟的开源 NSIS 打包工具
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: 构建 Windows 一键安装程序
        shell: pwsh
        run: |
          $releaseVersion = '${{ github.ref_name }}'.TrimStart('v')
          $sourceRoot = Join-Path '${{ github.workspace }}' 'build\distribution\windows'
          $outputDir = Join-Path '${{ github.workspace }}' 'build\installer'
          $vsixName = 'Code-Runtime-Analyzer-${{ github.ref_name }}.vsix'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source
          & $makensis "/DAPP_VERSION=$releaseVersion" "/DSOURCE_ROOT=$sourceRoot" "/DOUTPUT_DIR=$outputDir" "/DVSIX_NAME=$vsixName" 'installer\windows\CodeRuntimeAnalyzer.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 生成下载校验值
        shell: pwsh
        run: |
          $assets = @(
            'build\installer\Code-Runtime-Analyzer-Setup-${{ github.ref_name }}.exe',
            'Code-Runtime-Analyzer-${{ github.ref_name }}.vsix'
          )
          $lines = $assets | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_
            "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_))"
          }
          Set-Content -LiteralPath 'SHA256SUMS.txt' -Value $lines -Encoding utf8NoBOM

      - name: 创建 GitHub Release 并上传完整安装包
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/installer/Code-Runtime-Analyzer-Setup-${{ github.ref_name }}.exe
            Code-Runtime-Analyzer-${{ github.ref_name }}.vsix
            SHA256SUMS.txt
