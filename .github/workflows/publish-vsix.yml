name: 发布 EXE、VSIX 和 MCP 安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建后台 EXE、编辑器 VSIX 和独立 MCP 包
    runs-on: windows-latest

    steps:
      - name: 取出本次版本的源码
        uses: actions/checkout@v4

      - name: 检查版本标签和源码版本一致
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $packageVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "版本标签 $tagVersion 与 package.json 版本 $packageVersion 不一致。请先对齐版本再发布。"
          }

      - name: 准备 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            extension/package-lock.json
            web/package-lock.json

      - name: 安装构建依赖
        shell: pwsh
        run: npm run install:all

      - name: 准备固定且配套的 C++ 测试工具链
        shell: pwsh
        run: |
          $archive = Join-Path '${{ runner.temp }}' 'llvm-mingw-20260519-ucrt-x86_64.zip'
          $destination = Join-Path '${{ runner.temp }}' 'llvm-mingw-20260519'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260519/llvm-mingw-20260519-ucrt-x86_64.zip' -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expectedHash = '72dbd6e64614e3b3401998992d1bd9c8ace29e74611d71c80309ea71c3fb26f9'
          if ($actualHash -ne $expectedHash) { throw "LLVM-MinGW 下载文件校验失败：$actualHash" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $clangd = Get-ChildItem -LiteralPath $destination -Recurse -Filter 'clangd.exe' | Select-Object -First 1
          $clangxx = Get-ChildItem -LiteralPath $destination -Recurse -Filter 'clang++.exe' | Select-Object -First 1
          if (-not $clangd -or -not $clangxx) { throw 'LLVM-MinGW 压缩包缺少 clangd.exe 或 clang++.exe' }
          "CLANGD_TEST_PATH=$($clangd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLANGXX_PATH=$($clangxx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $clangd.FullName --version
          & $clangxx.FullName --version

      - name: 生成独立 Clang 测试夹具
        shell: pwsh
        run: npm run prepare:test-fixture

      - name: 执行后台测试
        shell: pwsh
        run: |
          npm --prefix backend test 2>&1 | Tee-Object -FilePath 'backend-test.log'
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            @(
              '### 后台测试失败详情',
              '',
              '```text'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content -LiteralPath 'backend-test.log' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $details = Get-Content -LiteralPath 'backend-test.log' -Raw
            $failureMarker = $details.LastIndexOf('✖ failing tests:')
            if ($failureMarker -ge 0) { $details = $details.Substring($failureMarker) }
            if ($details.Length -gt 3500) { $details = $details.Substring(0, 3500) }
            $annotation = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=后台测试失败详情::$annotation"
            exit $testExitCode
          }

      - name: 执行小、中、大三档性能门禁
        shell: pwsh
        run: npm run test:performance

      - name: 从 GitHub Secrets 临时导入正式代码签名证书
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw '缺少 WINDOWS_CODE_SIGNING_PFX_BASE64。为避免发布未知发布者安装包，本次 Release 已停止。'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw '缺少 WINDOWS_CODE_SIGNING_PFX_PASSWORD。证书密码只能存放在 GitHub Actions Secret。'
          }
          $pfxPath = Join-Path '${{ runner.temp }}' 'code-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password -Exportable:$false
            if (-not $certificate -or -not $certificate.HasPrivateKey) { throw 'PFX 没有可用的私钥。' }
            if ($certificate.NotAfter -le (Get-Date)) { throw '代码签名证书已经过期。' }
            "WINDOWS_CODE_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: 生成全部安装包并强制执行 Authenticode 签名
        shell: pwsh
        run: .\build.ps1 all -SkipInstall -RequireSigning

      - name: 再次验证发布 EXE 的可信签名
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\sign-windows-artifact.ps1 -FilePath "dist\Code-Runtime-Analyzer-Setup-v$version.exe" -VerifyOnly
          .\scripts\sign-windows-artifact.ps1 -FilePath 'build\distribution\windows\backend-control.exe' -VerifyOnly

      - name: 在一次性 Windows 环境完整安装并卸载 EXE
        shell: pwsh
        run: |
          $expectedVersion = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\test-windows-installer.ps1 -InstallerExe "dist\Code-Runtime-Analyzer-Setup-${{ github.ref_name }}.exe" -ExpectedVersion $expectedVersion

      - name: 创建 GitHub Release 并上传完整安装包
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Code-Runtime-Analyzer-Setup-${{ github.ref_name }}.exe
            dist/Code-Runtime-Analyzer-默认右侧栏-${{ github.ref_name }}.vsix
            dist/Code-Runtime-Analyzer-兼容布局-${{ github.ref_name }}.vsix
            dist/Code-Runtime-Analyzer-MCP-${{ github.ref_name }}.tgz
            dist/SHA256SUMS.txt
